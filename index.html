<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URLPurifier - URL浄化ツール</title>
  <!-- セキュリティヘッダー。frame-ancestors はmetaでは効かないため、
       クリックジャッキングの扱いはREADMEに書く -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none';">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="./style.css" />
  <meta name="description" content="URLに含まれるトラッキングやアフィリエイト要素を削除し、シンプルで純粋なリンクに整えるクライアントサイドWebツール。Amazon専用最短化モード搭載。">
</head>
<body>
  <header class="site-header">
    <h1>URLPurifier</h1>
    <p class="subtitle" data-i18n="app.subtitle">URL浄化ツール</p>
    <div class="header-actions">
      <button id="btnTheme" type="button" class="btn-theme" data-i18n-attr="aria-label: theme.toggle, title: theme.toggleTitle" aria-label="テーマ切り替え" title="ライト/ダークモード切り替え">
      <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <button id="btnLang" type="button" class="btn-lang" data-i18n="lang.toggle" data-i18n-attr="title: lang.toggleTitle, aria-label: lang.toggleTitle">English</button>
    <button id="btnHelp" type="button" class="btn-help" data-i18n-attr="aria-label: help.open" aria-label="ヘルプ">?</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 data-i18n="form.clean">クリーン化</h2>
      <div class="form-row">
        <label for="inputUrls" class="label" data-i18n="form.inputLabel">URLを貼り付け（複数行OK）</label>
        <textarea id="inputUrls" class="textarea" rows="8" data-i18n-attr="placeholder: form.inputPlaceholder" placeholder="例：
https://www.amazon.co.jp/dp/XXXXXXXXXX?tag=abc-22&ref=abc&utm_source=x
https://example.com/article?utm_source=twitter&fbclid=xxx"></textarea>
      </div>

      <div class="options">
        <label class="checkbox">
          <input type="checkbox" id="amazonMode" />
          <span data-i18n="form.amazonMode">Amazonのリンクを /dp/ASIN の形まで短くする</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="strictBlocklist" />
          <span data-i18n="form.strictMode">詳細除去モード</span>
        </label>
        <div class="custom-rules">
          <label for="customParams" class="label" data-i18n="form.customLabel">自分で消したい名前（カンマ区切り）</label>
          <input type="text" id="customParams" class="input" data-i18n-attr="placeholder: form.customPlaceholder" placeholder="例: ref, from, cid">
          <p class="custom-rules-note" data-i18n="form.customNote">この設定は、この端末にだけ保存します。</p>
        </div>
      </div>

      <div class="buttons">
        <button id="btnClean" type="button" class="btn primary" data-i18n="form.clean" data-i18n-attr="title: form.cleanHint" title="Ctrl+Enter でも実行できます">クリーン化</button>
        <button id="btnClear" type="button" class="btn ghost" data-i18n="form.clear">クリア</button>
      </div>

      <div class="form-row">
        <div class="label-with-button">
          <label for="outputUrls" class="label" data-i18n="form.outputLabel">結果</label>
          <button id="btnCopy" type="button" class="btn-copy-output" data-i18n="form.copy">結果をコピー</button>
        </div>
        <textarea id="outputUrls" class="textarea" rows="8" readonly data-i18n-attr="placeholder: form.outputPlaceholder" placeholder="ここに結果が出ます"></textarea>
      </div>

      <details class="details">
        <summary data-i18n="summary.title">何を消す？（概要）</summary>
        <ul>
          <li data-i18n="summary.common"></li>
          <li data-i18n="summary.site"></li>
          <li data-i18n="summary.amazon"></li>
          <li data-i18n="summary.strict"></li>
          <li data-i18n="summary.fragment"></li>
        </ul>
      </details>
    </section>
  </main>

  <footer>
    <div class="footer">
      <span data-i18n="footer.repo">🔗 GitHubリポジトリはこちら</span>（ <a href="https://github.com/ipusiron/urlpurifier" target="_blank" rel="noopener noreferrer">ipusiron/urlpurifier</a> ）
    </div>
  </footer>

  <!-- ヘルプモーダル -->
  <div id="helpModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="helpModalTitle" data-i18n="modal.title">URLPurifier のヘルプ</h2>
        <button class="modal-close" type="button" data-i18n-attr="aria-label: common.close" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body">
        <section>
          <h3 data-i18n="help.about.title">このツールについて</h3>
          <p data-i18n="help.about.body"></p>
        </section>

        <section>
          <h3 data-i18n="help.use.title">使い方</h3>
          <ol>
            <li data-i18n-html="help.use.step1html"></li>
            <li data-i18n-html="help.use.step2html"></li>
            <li data-i18n-html="help.use.step3html"></li>
            <li data-i18n-html="help.use.step4html"></li>
          </ol>
        </section>

        <section>
          <h3 data-i18n="help.remove.title">消すもの</h3>
          <ul>
            <li data-i18n-html="help.remove.commonhtml"></li>
            <li data-i18n-html="help.remove.sitehtml"></li>
            <li data-i18n-html="help.remove.strricthtml"></li>
            <li data-i18n-html="help.remove.amazonhtml"></li>
            <li data-i18n-html="help.remove.fragmenthtml"></li>
          </ul>
        </section>

        <section>
          <h3 data-i18n="help.keep.title">消さないもの</h3>
          <p data-i18n="help.keep.body"></p>
        </section>

        <section>
          <h3 data-i18n="help.risk.title">貼る前に見ておきたい点</h3>
          <p class="help-callout" data-i18n="help.risk.body"></p>
        </section>

        <section>
          <h3 data-i18n="help.privacy.title">プライバシーと、このツールの限界</h3>
          <ul>
            <li data-i18n="help.privacy.local"></li>
            <li data-i18n="help.privacy.scheme"></li>
            <li data-i18n="help.privacy.shortener"></li>
            <li data-i18n="help.privacy.frame"></li>
          </ul>
        </section>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./i18n.js"></script>
  <script src="./script.js"></script>
</body>
</html>
